<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZUTECHSAM Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fd;color:#172e56;font-family:system-ui,Arial}header{background:white;border-bottom:1px solid #dfe7f3;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:23px}main{max-width:1200px;margin:35px auto;padding:0 20px}.panel{background:white;border:1px solid #e1e8f2;border-radius:18px;padding:25px;margin-bottom:20px;box-shadow:0 12px 30px #163e7510}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd8ea;border-radius:10px;margin:6px 0 12px;font:inherit}textarea{min-height:85px}button{border:0;background:#1765e8;color:white;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;margin:4px}button.alt{background:#eaf1fc;color:#1a4b99}button.danger{background:#b63e49}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{border-bottom:1px solid #e5eaf2;padding:14px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.small{font-size:13px;color:#687993}.hide{display:none!important}.top{display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stat{display:inline-block;background:#eaf2ff;border-radius:12px;padding:14px;margin:5px}.message{color:#ba4b31;font-size:14px;min-height:22px}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{display:block}.panel{padding:17px}}</style><style>
:root{--ink:#142b53;--blue:#1765e8;--gold:#d7a33c;--line:#e2eaf5}
body{background:#f3f7fd;color:var(--ink)}
body>header{position:sticky;top:0;z-index:10;height:74px;padding:14px 28px 14px 282px;background:#fff;box-shadow:0 1px 0 var(--line)}
body>header h1{font-size:20px;letter-spacing:-.4px}
main{max-width:none;margin:0 0 0 254px;padding:32px;min-height:calc(100vh - 74px)}
.panel{border-radius:20px;box-shadow:0 9px 30px #183d7310;border:1px solid #e1eaf6;padding:26px}
.panel h2{font-size:21px;letter-spacing:-.5px}
button{transition:.15s;box-shadow:none}button:hover{filter:brightness(.96)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9ec3ff;outline-offset:1px}
input,select,textarea{background:#fff;border-color:#d5e0ef}
#dashboard>.top{background:transparent;margin-bottom:22px}
#dashboard>.top h2{font-size:28px;margin:0}
.stat{background:white;border:1px solid var(--line);padding:22px 26px;min-width:155px;font-weight:750;color:#1a4c9b}
#projectForm .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
#projects .row,#enquiries .row{border:1px solid #e6edf7;border-radius:13px;padding:17px;margin:10px 0;background:#fcfdff}
#projects .row strong{font-size:16px}
#loginPanel{max-width:450px!important;margin:70px auto!important}
#sidebar{position:fixed;inset:0 auto 0 0;width:254px;background:linear-gradient(175deg,#0e2a61,#102149);z-index:12;padding:27px 16px;color:#fff;display:flex;flex-direction:column;gap:8px;box-shadow:5px 0 25px #183a671c}
#sidebar .mark{padding:4px 13px 26px;font-size:23px;font-weight:950;letter-spacing:-.8px}
#sidebar .mark span{color:#e6b54b}
#sidebar .sub{display:block;font-size:10px;letter-spacing:2px;font-weight:600;color:#a8c4f3;margin-top:5px}
#sidebar button{width:100%;background:transparent;color:#c5d8f8;text-align:left;border-radius:11px;padding:14px 16px;font-size:14px;margin:0}
#sidebar button.active{background:#286be2;color:#fff}
#sidebar .sidefoot{margin-top:auto;border-top:1px solid #ffffff25;padding:18px 12px;color:#9cb4dc;font-size:12px}
#mobileMenu{display:none}
#overviewCards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:25px}
.metric{background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px}
.metric .micon{display:inline-grid;place-items:center;background:#eaf2ff;border-radius:11px;width:43px;height:43px;font-size:22px}
.metric strong{display:block;font-size:29px;margin-top:12px}
.metric small{color:#70819d}
#dashboard .top .stat{display:none}
#dashboard .panel{scroll-margin-top:100px}
#dashboard .panel[hidden]{display:none!important}
#intro{margin:0 0 22px;color:#71819b}
#quickActions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
#quickActions button{padding:12px 17px}
#featureNote{border-left:4px solid #d7a33c;background:#fff8e8;padding:15px 18px;border-radius:10px;font-size:13px;color:#6d592c;margin-bottom:22px}
@media(max-width:850px){body>header{padding:14px 18px 14px 65px;height:68px}main{margin-left:0;padding:18px}#sidebar{transform:translateX(-100%);transition:transform .2s}#sidebar.open{transform:translateX(0)}#mobileMenu{display:block;position:fixed;z-index:13;top:15px;left:12px;background:#e9f1ff;color:#1d4b9d;padding:8px 11px}#overviewCards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){#overviewCards{grid-template-columns:1fr 1fr;gap:10px}.metric{padding:15px}.metric strong{font-size:24px}.metric small{font-size:11px}#projectForm .grid{grid-template-columns:1fr}body>header h1{font-size:17px}main{padding:14px}.panel{padding:18px}#dashboard>.top h2{font-size:24px}}
</style></head><body><header><h1>🔷 ZUTECHSAM <span style="color:#c5962e">ADMIN</span></h1><button id="logout" class="alt hide">Logout</button></header><main><section class="panel" id="loginPanel" style="max-width:440px;margin:50px auto"><h2>Secure Admin Login</h2><p class="small">Sign in with the credentials configured in Railway.</p><form id="login"><input name="username" placeholder="Username" required autocomplete="username"><input name="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign In</button></form><p class="message" id="loginMsg"></p></section><div id="dashboard" class="hide"><div class="top"><h2>Dashboard</h2><div><span class="stat" id="projectCount">0 Projects</span><span class="stat" id="enquiryCount">0 Enquiries</span></div></div><section class="panel"><h2 id="editorTitle">Add Project</h2><form id="projectForm"><div class="grid"><label>Project Title<input name="title" required maxlength="150"></label><label>Category<select name="category"><option>Apps</option><option>Games</option><option>AI</option><option>Websites</option><option>Software</option></select></label></div><label>Short Summary<input name="summary" maxlength="400"></label><label>Description<textarea name="description"></textarea></label><div class="grid"><label>Image HTTPS URL<input name="image_url" type="url" placeholder="https://"></label><label>Live Demo HTTPS URL<input name="demo_url" type="url" placeholder="https://"></label><label>APK HTTPS URL<input name="apk_url" type="url" placeholder="https://"></label><label>Video HTTPS URL<input name="video_url" type="url" placeholder="https://"></label></div><label><input type="checkbox" name="featured" style="width:auto"> Featured project</label><label style="margin-left:20px"><input type="checkbox" name="published" checked style="width:auto"> Published</label><div><button>Save Project</button><button type="button" class="alt" id="cancel">Clear</button></div><p class="message" id="projectMsg"></p></form></section><section class="panel"><h2>Manage Projects</h2><div id="projects"></div></section><section class="panel"><h2>Customer Enquiries</h2><div id="enquiries"></div></section></div></main><script>
let token=sessionStorage.getItem('zutechsam_admin_token')||'',editing=null,items=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'content-type':'application/json',authorization:'Bearer '+token},body:data?JSON.stringify(data):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}function view(on){$('loginPanel').classList.toggle('hide',on);$('dashboard').classList.toggle('hide',!on);$('logout').classList.toggle('hide',!on)}$('login').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{token=(await api('/api/login','POST',d)).token;sessionStorage.setItem('zutechsam_admin_token',token);view(true);await refresh()}catch(err){$('loginMsg').textContent=err.message}};$('logout').onclick=async()=>{try{await api('/api/logout','POST')}catch{}token='';sessionStorage.removeItem('zutechsam_admin_token');view(false)};
function clear(){editing=null;$('projectForm').reset();$('editorTitle').textContent='Add Project';$('projectMsg').textContent=''}$('cancel').onclick=clear;
async function refresh(){try{const [p,e]=await Promise.all([api('/api/admin/projects'),api('/api/admin/enquiries')]);items=p;$('projectCount').textContent=p.length+' Projects';$('enquiryCount').textContent=e.length+' Enquiries';$('projects').innerHTML=p.length?p.map(x=>'<div class="row"><div><strong>'+esc(x.title)+'</strong><div class="small">'+esc(x.category)+' · '+(x.published?'Published':'Draft')+'</div></div><div><button class="alt" data-edit="'+x.id+'">Edit</button><button class="danger" data-delete="'+x.id+'">Delete</button></div></div>').join(''):'<p class="small">No projects yet.</p>';$('enquiries').innerHTML=e.length?e.map(x=>'<div class="row"><div><strong>'+esc(x.name)+'</strong> · '+esc(x.service)+'<div class="small">'+esc(x.email)+' · '+new Date(x.created_at).toLocaleString()+'</div><p>'+esc(x.message)+'</p></div><select data-status="'+x.id+'" style="max-width:150px"><option '+(x.status==='new'?'selected':'')+'>new</option><option '+(x.status==='contacted'?'selected':'')+'>contacted</option><option '+(x.status==='closed'?'selected':'')+'>closed</option></select></div>').join(''):'<p class="small">No enquiries yet.</p>'}catch(err){$('projectMsg').textContent=err.message;if(err.message==='Login required'){$('logout').click()}}}
$('projects').onclick=async e=>{const id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;if(e.target.dataset.delete){if(!confirm('Delete this project?'))return;try{await api('/api/admin/projects/'+id,'DELETE');await refresh()}catch(err){alert(err.message)}return}const p=items.find(x=>String(x.id)===id);editing=id;for(const k of ['title','category','summary','description','image_url','demo_url','apk_url','video_url'])$('projectForm').elements[k].value=p[k]||'';$('projectForm').elements.featured.checked=p.featured;$('projectForm').elements.published.checked=p.published;$('editorTitle').textContent='Edit Project';$('projectForm').scrollIntoView({behavior:'smooth'})};
$('enquiries').onchange=async e=>{if(!e.target.dataset.status)return;try{await api('/api/admin/enquiries/'+e.target.dataset.status,'PATCH',{status:e.target.value})}catch(err){alert(err.message)}};
$('projectForm').onsubmit=async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));d.featured=f.elements.featured.checked;d.published=f.elements.published.checked;try{await api('/api/admin/projects'+(editing?'/'+editing:''),editing?'PUT':'POST',d);clear();await refresh()}catch(err){$('projectMsg').textContent=err.message}};
if(token){view(true);refresh()}
</script><script>
(function(){
const dashboard=document.getElementById('dashboard');
const panels=[...dashboard.querySelectorAll(':scope > section.panel')];
panels.forEach((p,i)=>p.dataset.section=['editor','projects','enquiries'][i]);
const side=document.createElement('aside');side.id='sidebar';side.innerHTML='<div class="mark">◆ ZU<span>TECHSAM</span><span class="sub">ADMIN CONTROL CENTER</span></div><button data-nav="overview">▦ &nbsp; Overview</button><button data-nav="projects">▣ &nbsp; All Projects</button><button data-nav="editor">＋ &nbsp; Add Project</button><button data-nav="enquiries">✉ &nbsp; Enquiries</button><div class="sidefoot">ZUTECHSAM SOFTWARE SOLUTIONS<br>Secure management dashboard</div>';
document.body.appendChild(side);
const menu=document.createElement('button');menu.id='mobileMenu';menu.textContent='☰';menu.setAttribute('aria-label','Open navigation');document.body.appendChild(menu);
menu.onclick=()=>{side.classList.toggle('open');menu.textContent=side.classList.contains('open')?'✕':'☰'};
const intro=document.createElement('p');intro.id='intro';intro.textContent='Manage your projects, publishing and customer requests from one place.';dashboard.querySelector('.top').after(intro);
const cards=document.createElement('div');cards.id='overviewCards';cards.innerHTML='<div class="metric"><span class="micon">📁</span><strong id="metricProjects">—</strong><small>Total projects</small></div><div class="metric"><span class="micon">🌐</span><strong id="metricPublished">—</strong><small>Published projects</small></div><div class="metric"><span class="micon">✉️</span><strong id="metricEnquiries">—</strong><small>Customer enquiries</small></div>';intro.after(cards);
const actions=document.createElement('div');actions.id='quickActions';actions.innerHTML='<button data-jump="editor">＋ Add New Project</button><button class="alt" data-jump="projects">View All Projects</button><button class="alt" data-jump="enquiries">Customer Enquiries</button>';cards.after(actions);
const note=document.createElement('div');note.id='featureNote';note.textContent='File upload and media storage are not active yet. Project images, APKs and videos currently use external HTTPS links. Do not upload files or passwords to GitHub.';actions.after(note);
function navigate(section){side.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===section));const overview=section==='overview';cards.hidden=!overview;actions.hidden=!overview;note.hidden=!overview;panels.forEach(p=>p.hidden=!(overview?(p.dataset.section==='projects'||p.dataset.section==='enquiries'):p.dataset.section===section));side.classList.remove('open');menu.textContent='☰';if(!overview)dashboard.scrollIntoView({behavior:'smooth',block:'start'})}
side.onclick=e=>{const b=e.target.closest('[data-nav]');if(b)navigate(b.dataset.nav)};
actions.onclick=e=>{const b=e.target.closest('[data-jump]');if(b)navigate(b.dataset.jump)};
const oldRefresh=window.refresh;
function updateMetrics(){const p=document.getElementById('projectCount').textContent,e=document.getElementById('enquiryCount').textContent;document.getElementById('metricProjects').textContent=p.match(/\d+/)?.[0]||'0';document.getElementById('metricEnquiries').textContent=e.match(/\d+/)?.[0]||'0';document.getElementById('metricPublished').textContent=[...document.querySelectorAll('#projects .row')].filter(x=>x.textContent.includes('Published')).length}
const obs=new MutationObserver(updateMetrics);obs.observe(document.getElementById('projects'),{childList:true,subtree:true});obs.observe(document.getElementById('enquiries'),{childList:true,subtree:true});
document.getElementById('projects').addEventListener('click',e=>{if(e.target.closest('[data-edit]'))navigate('editor')});
document.getElementById('cancel').addEventListener('click',()=>navigate('projects'));
document.getElementById('projectForm').addEventListener('submit',()=>setTimeout(()=>navigate('projects'),900));
navigate('overview');
})();
</script></body></html>
