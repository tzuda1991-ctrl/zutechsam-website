<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZUTECHSAM Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fd;color:#172e56;font-family:system-ui,Arial}header{background:white;border-bottom:1px solid #dfe7f3;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:23px}main{max-width:1200px;margin:35px auto;padding:0 20px}.panel{background:white;border:1px solid #e1e8f2;border-radius:18px;padding:25px;margin-bottom:20px;box-shadow:0 12px 30px #163e7510}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd8ea;border-radius:10px;margin:6px 0 12px;font:inherit}textarea{min-height:85px}button{border:0;background:#1765e8;color:white;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;margin:4px}button.alt{background:#eaf1fc;color:#1a4b99}button.danger{background:#b63e49}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row{border-bottom:1px solid #e5eaf2;padding:14px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.small{font-size:13px;color:#687993}.hide{display:none!important}.top{display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stat{display:inline-block;background:#eaf2ff;border-radius:12px;padding:14px;margin:5px}.message{color:#ba4b31;font-size:14px;min-height:22px}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{display:block}.panel{padding:17px}}</style></head><body><header><h1>🔷 ZUTECHSAM <span style="color:#c5962e">ADMIN</span></h1><button id="logout" class="alt hide">Logout</button></header><main><section class="panel" id="loginPanel" style="max-width:440px;margin:50px auto"><h2>Secure Admin Login</h2><p class="small">Sign in with the credentials configured in Railway.</p><form id="login"><input name="username" placeholder="Username" required autocomplete="username"><input name="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign In</button></form><p class="message" id="loginMsg"></p></section><div id="dashboard" class="hide"><div class="top"><h2>Dashboard</h2><div><span class="stat" id="projectCount">0 Projects</span><span class="stat" id="enquiryCount">0 Enquiries</span></div></div><section class="panel"><h2 id="editorTitle">Add Project</h2><form id="projectForm"><div class="grid"><label>Project Title<input name="title" required maxlength="150"></label><label>Category<select name="category"><option>Apps</option><option>Games</option><option>AI</option><option>Websites</option><option>Software</option></select></label></div><label>Short Summary<input name="summary" maxlength="400"></label><label>Description<textarea name="description"></textarea></label><div class="grid"><label>Image HTTPS URL<input name="image_url" type="url" placeholder="https://"></label><label>Live Demo HTTPS URL<input name="demo_url" type="url" placeholder="https://"></label><label>APK HTTPS URL<input name="apk_url" type="url" placeholder="https://"></label><label>Video HTTPS URL<input name="video_url" type="url" placeholder="https://"></label></div><label><input type="checkbox" name="featured" style="width:auto"> Featured project</label><label style="margin-left:20px"><input type="checkbox" name="published" checked style="width:auto"> Published</label><div><button>Save Project</button><button type="button" class="alt" id="cancel">Clear</button></div><p class="message" id="projectMsg"></p></form></section><section class="panel"><h2>Manage Projects</h2><div id="projects"></div></section><section class="panel"><h2>Customer Enquiries</h2><div id="enquiries"></div></section></div></main><script>
let token=sessionStorage.getItem('zutechsam_admin_token')||'',editing=null,items=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'content-type':'application/json',authorization:'Bearer '+token},body:data?JSON.stringify(data):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}function view(on){$('loginPanel').classList.toggle('hide',on);$('dashboard').classList.toggle('hide',!on);$('logout').classList.toggle('hide',!on)}$('login').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{token=(await api('/api/login','POST',d)).token;sessionStorage.setItem('zutechsam_admin_token',token);view(true);await refresh()}catch(err){$('loginMsg').textContent=err.message}};$('logout').onclick=async()=>{try{await api('/api/logout','POST')}catch{}token='';sessionStorage.removeItem('zutechsam_admin_token');view(false)};
function clear(){editing=null;$('projectForm').reset();$('editorTitle').textContent='Add Project';$('projectMsg').textContent=''}$('cancel').onclick=clear;
async function refresh(){try{const [p,e]=await Promise.all([api('/api/admin/projects'),api('/api/admin/enquiries')]);items=p;$('projectCount').textContent=p.length+' Projects';$('enquiryCount').textContent=e.length+' Enquiries';$('projects').innerHTML=p.length?p.map(x=>'<div class="row"><div><strong>'+esc(x.title)+'</strong><div class="small">'+esc(x.category)+' · '+(x.published?'Published':'Draft')+'</div></div><div><button class="alt" data-edit="'+x.id+'">Edit</button><button class="danger" data-delete="'+x.id+'">Delete</button></div></div>').join(''):'<p class="small">No projects yet.</p>';$('enquiries').innerHTML=e.length?e.map(x=>'<div class="row"><div><strong>'+esc(x.name)+'</strong> · '+esc(x.service)+'<div class="small">'+esc(x.email)+' · '+new Date(x.created_at).toLocaleString()+'</div><p>'+esc(x.message)+'</p></div><select data-status="'+x.id+'" style="max-width:150px"><option '+(x.status==='new'?'selected':'')+'>new</option><option '+(x.status==='contacted'?'selected':'')+'>contacted</option><option '+(x.status==='closed'?'selected':'')+'>closed</option></select></div>').join(''):'<p class="small">No enquiries yet.</p>'}catch(err){$('projectMsg').textContent=err.message;if(err.message==='Login required'){$('logout').click()}}}
$('projects').onclick=async e=>{const id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;if(e.target.dataset.delete){if(!confirm('Delete this project?'))return;try{await api('/api/admin/projects/'+id,'DELETE');await refresh()}catch(err){alert(err.message)}return}const p=items.find(x=>String(x.id)===id);editing=id;for(const k of ['title','category','summary','description','image_url','demo_url','apk_url','video_url'])$('projectForm').elements[k].value=p[k]||'';$('projectForm').elements.featured.checked=p.featured;$('projectForm').elements.published.checked=p.published;$('editorTitle').textContent='Edit Project';$('projectForm').scrollIntoView({behavior:'smooth'})};
$('enquiries').onchange=async e=>{if(!e.target.dataset.status)return;try{await api('/api/admin/enquiries/'+e.target.dataset.status,'PATCH',{status:e.target.value})}catch(err){alert(err.message)}};
$('projectForm').onsubmit=async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));d.featured=f.elements.featured.checked;d.published=f.elements.published.checked;try{await api('/api/admin/projects'+(editing?'/'+editing:''),editing?'PUT':'POST',d);clear();await refresh()}catch(err){$('projectMsg').textContent=err.message}};
if(token){view(true);refresh()}
</script></body></html>
